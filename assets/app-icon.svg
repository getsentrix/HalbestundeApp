<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="25%" stop-color="rgba(0,229,255,0.4)" />
      <stop offset="70%" stop-color="rgba(255,179,0,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.8)" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Ambient background glow blobs -->
  <circle cx="140" cy="160" r="120" fill="#00E5FF" opacity="0.22" filter="blur(40px)" />
  <circle cx="360" cy="340" r="130" fill="#FFB300" opacity="0.18" filter="blur(45px)" />
  <circle cx="256" cy="256" r="90" fill="#D500F9" opacity="0.12" filter="blur(50px)" />

  <!-- Glass Card Container -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="rgba(255, 255, 255, 0.05)" stroke="url(#glassRim)" stroke-width="3" filter="url(#glassShadow)" />

  <!-- Staff Lines -->
  <g stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="170" x2="412" y2="170" />
    <line x1="100" y1="195" x2="412" y2="195" />
    <line x1="100" y1="220" x2="412" y2="220" />
    <line x1="100" y1="245" x2="412" y2="245" />
    <line x1="100" y1="270" x2="412" y2="270" />
  </g>

  <!-- Glowing Laser Scan Line -->
  <line x1="80" y1="220" x2="432" y2="220" stroke="#00E5FF" stroke-width="3" filter="url(#neonBlur)" opacity="0.9" />

  <!-- Musical Treble Clef Stylized Vector -->
  <path d="M 230 140 C 245 130 265 145 265 165 C 265 195 235 210 235 235 C 235 270 275 285 275 255 C 275 240 260 235 250 245 C 245 250 245 260 252 265 C 255 268 250 275 240 270 C 230 260 230 245 238 232 C 248 215 268 200 252 165 C 242 145 230 152 230 140 Z" fill="url(#amberGlow)" filter="url(#neonBlur)" opacity="0.85" />

  <!-- Piano Keyboard at Bottom -->
  <g transform="translate(106, 310)">
    <!-- White Keys with Glass Finish -->
    <rect x="0" y="0" width="40" height="96" rx="6" fill="#F8FAFC" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" />
    <rect x="43" y="0" width="40" height="96" rx="6" fill="#F8FAFC" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" />
    <rect x="86" y="0" width="40" height="96" rx="6" fill="#00E5FF" stroke="#00B0FF" stroke-width="2" filter="url(#neonBlur)" opacity="0.9" />
    <rect x="129" y="0" width="40" height="96" rx="6" fill="#F8FAFC" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" />
    <rect x="172" y="0" width="40" height="96" rx="6" fill="#FFB300" stroke="#FF8F00" stroke-width="2" filter="url(#neonBlur)" opacity="0.9" />
    <rect x="215" y="0" width="40" height="96" rx="6" fill="#F8FAFC" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" />
    <rect x="258" y="0" width="40" height="96" rx="6" fill="#F8FAFC" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" />

    <!-- Black Keys -->
    <rect x="26" y="0" width="26" height="58" rx="4" fill="#0F172A" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <rect x="71" y="0" width="26" height="58" rx="4" fill="#0F172A" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <rect x="156" y="0" width="26" height="58" rx="4" fill="#0F172A" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <rect x="200" y="0" width="26" height="58" rx="4" fill="#0F172A" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <rect x="244" y="0" width="26" height="58" rx="4" fill="#0F172A" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  </g>

  <!-- Top Glass Highlight -->
  <path d="M 120 70 Q 256 60 392 70 Q 256 120 120 70 Z" fill="rgba(255, 255, 255, 0.35)" />
</svg>
