<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#131B2E" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>
    <linearGradient id="sheetBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.1)" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="220" r="160" fill="#007AFF" opacity="0.16" filter="blur(40px)" />
  <circle cx="256" cy="220" r="110" fill="#00E5FF" opacity="0.12" filter="blur(30px)" />

  <!-- Sheet Music Card -->
  <rect x="100" y="80" width="312" height="370" rx="36" fill="#182030" stroke="url(#sheetBorder)" stroke-width="2.5" />

  <!-- Corner Reticles (Document Scanner / OMR) -->
  <g stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 120 120 L 120 100 L 140 100" />
    <!-- Top-Right -->
    <path d="M 372 100 L 392 100 L 392 120" />
    <!-- Bottom-Right -->
    <path d="M 392 410 L 392 430 L 372 430" />
    <!-- Bottom-Left -->
    <path d="M 140 430 L 120 430 L 120 410" />
  </g>

  <!-- Staff Lines -->
  <g stroke="#475569" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
    <line x1="136" y1="210" x2="376" y2="210" />
    <line x1="136" y1="232" x2="376" y2="232" />
    <line x1="136" y1="254" x2="376" y2="254" />
    <line x1="136" y1="276" x2="376" y2="276" />
    <line x1="136" y1="298" x2="376" y2="298" />
  </g>

  <!-- Glowing Laser Scan Line -->
  <line x1="126" y1="254" x2="386" y2="254" stroke="#00E5FF" stroke-width="2.5" filter="url(#laserGlow)" opacity="0.9" />

  <!-- Iconic Beamed Eighth Notes -->
  <g fill="url(#noteGrad)">
    <!-- Stems -->
    <rect x="222" y="170" width="6" height="100" rx="2" />
    <rect x="294" y="142" width="6" height="100" rx="2" />
    <!-- Beam -->
    <polygon points="222,170 300,142 300,156 222,184" />
    <!-- Noteheads (Tilted) -->
    <ellipse cx="212" cy="270" rx="19" ry="14" transform="rotate(-25 212 270)" />
    <ellipse cx="284" cy="242" rx="19" ry="14" transform="rotate(-25 284 242)" />
  </g>
</svg>
