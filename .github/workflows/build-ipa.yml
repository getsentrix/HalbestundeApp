name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build App Archive
        run: |
          mkdir -p build
          xcodebuild \
            -project HalbestundeApp.xcodeproj \
            -scheme HalbestundeApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/HalbestundeApp.app build/Payload/
          cd build
          zip -r HalbestundeApp.ipa Payload
          ls -lh HalbestundeApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalbestundeApp-IPA
          path: build/HalbestundeApp.ipa
          retention-days: 14
